name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q

  build-docker:
    name: Build e teste em container
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Build Docker image
        run: docker compose build

      - name: Start webapp service
        run: docker compose up -d webapp

      - name: Create evidence directories
        run: |
          mkdir -p logs data/output reports screenshots

      - name: Run bot in container
        run: docker compose run --rm bot-conferencia

      - name: Verify generated evidence
        run: |
          test -n "$(ls -A logs/ 2>/dev/null)" || (echo 'logs/ vazio' && exit 1)
          test -n "$(ls -A data/output/ 2>/dev/null)" || (echo 'data/output/ vazio' && exit 1)
          test -n "$(ls -A screenshots/ 2>/dev/null)" || (echo 'screenshots/ vazio' && exit 1)
          test -n "$(ls -A reports/ 2>/dev/null)" || (echo 'reports/ vazio' && exit 1)

      - name: Upload evidences
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-${{ github.run_number }}
          path: |
            logs/
            data/output/
            screenshots/
            reports/
