version: '3.8'

services:
  bot:
    build: .
    container_name: conferencia_bot
    environment:
      - EXECUTION_ID=${EXECUTION_ID:-local}
      - BOT_ID=${BOT_ID:-conferencia_bot}
    volumes:
      - ./logs:/app/logs
      - ./evidencias:/app/evidencias
      - ./data/processed:/app/data/processed
    ports:
      - "8000:8000"
    command: uvicorn webapp.main:app --host 0.0.0.0 --port 8000
