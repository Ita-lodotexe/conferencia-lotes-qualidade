<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Lotes</title>
    <style>
        :root {
            --bg-color: #18142a;
            --container-bg: rgba(25, 20, 43, 0.8);
            --neon-pink: #f72585;
            --border-color: rgba(255, 255, 255, 0.2);
            --input-bg: rgba(0, 0, 0, 0.2);
            --text-main: #ffffff;
            --text-muted: #a39fbd;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }
        .window-container {
            width: 100%;
            max-width: 520px;
            background: var(--container-bg);
            border: 2px solid var(--neon-pink);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(247, 37, 133, 0.5);
            overflow: hidden;
        }
        .window-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-color);
            gap: 15px;
        }
        .window-controls {
            display: flex;
            gap: 6px;
        }
        .control-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }
        .url-bar {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .form-body {
            padding: 24px;
        }
        .form-title-section {
            margin-bottom: 20px;
        }
        .form-title-section h1 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .form-title-section p {
            color: var(--text-muted);
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, #ff0055, var(--neon-pink));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .error-box {
            display: none;
            margin-top: 14px;
            padding: 14px;
            border-radius: 10px;
            background: rgba(255, 80, 80, 0.15);
            border: 1px solid rgba(255, 95, 86, 0.5);
            color: #ffb3b3;
        }
        .error-box.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="window-container">
        <div class="window-header">
            <div class="window-controls">
                <div class="control-dot dot-red"></div>
                <div class="control-dot dot-yellow"></div>
                <div class="control-dot dot-green"></div>
            </div>
            <div class="url-bar">
                <span>http://localhost:8080/login.html</span>
            </div>
        </div>
        <div class="form-body">
            <div class="form-title-section">
                <h1>Login do Sistema</h1>
                <p>Digite usuário e senha para acessar a automação de lotes.</p>
            </div>
            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" class="form-control" placeholder="Digite seu usuário" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" class="form-control" placeholder="Digite sua senha" autocomplete="current-password">
            </div>
            <button id="btn-login" type="button" class="btn-submit">Entrar</button>
            <div id="loginError" class="error-box"></div>
        </div>
    </div>
    <script>
        const loginButton = document.getElementById('btn-login');
        const loginError = document.getElementById('loginError');

        const USER_EXPECTED = 'bot_local';
        const PASS_EXPECTED = 'senha_dev';

        loginButton.addEventListener('click', function () {
            loginError.classList.remove('show');
            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value.trim();

            if (!usuario || !senha) {
                loginError.textContent = 'Por favor, preencha usuário e senha.';
                loginError.classList.add('show');
                return;
            }

            if (usuario !== USER_EXPECTED || senha !== PASS_EXPECTED) {
                loginError.textContent = 'Usuário ou senha incorretos.';
                loginError.classList.add('show');
                return;
            }

            window.location.href = 'lote-teste.html';
        });
    </script>
</body>
</html>
